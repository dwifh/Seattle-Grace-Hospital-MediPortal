<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8" />

            <div class="sidebar_logo">
            <div class="sidebar_logo-name">Seattle Grace Hospital</div>
            </div>
        
            <!-- Admin nav — visible when role == 'admin' -->
            <nav class="sidebar_section" id="admin-nav">
                <div class="sidebar_section-label">Main</div>
                <a class="sidebar_item" href="#">Dashboard</a>
                <div class="sidebar_section-label">Management</div>
                <a class="sidebar_item" href="#">Patients</a>
                <a class="sidebar_item" href="#">Doctors</a>
                <a class="sidebar_item" href="#">Staff</a>
                <a class="sidebar_item" href="#">Appointments</a>
            </nav>

            <div class="sidebar_footer">
            <div class="sidebar_logout">Logout</div>
            </div>
        </div>
 
<!-- ==================================================================================================================================== -->

        <!-- ======================== -->
        <!--      AYUSH SECTIONS      -->

        <div id="dashboard-login" hidden> ... </div>
        <div id="dashboard-admin" hidden> ... </div>
        <div id="dashboard-nurse" hidden> ... </div>
        <div id="dashboard-receptionist" hidden> ... </div>

<!-- ==================================================================================================================================== -->

        <!-- ======================== -->
        <!--   TIANA SECTIONS        -->
        <!-- ======================== -->
        <div id="dashboard-patient" hidden> ... </div>
        <div id="dashboard-doctor" hidden> ... </div>
        <div id="dashboard-guardian" hidden> ... </div>

<!-- ==================================================================================================================================== -->
